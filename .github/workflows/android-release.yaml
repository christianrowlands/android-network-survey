name: Network Survey Release

on:
  push:
    tags:
      - 'v*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest

    strategy:
      matrix:
        api-level: [ 26, 36 ]
        target: [ default, google_apis ]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Save google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" > networksurvey/google-services.json

      - name: Unit Tests
        run: ./gradlew test --stacktrace

      # Only upload the reports on failure
      - name: Upload Reports
        uses: actions/upload-artifact@v6
        with:
          name: Test-Reports
          path: networksurvey/build/reports
        if: failure()

  buildRelease:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Save Keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: echo $KEYSTORE_FILE | base64 -d > my.keystore

      - name: Build CDR Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          OCID_API_KEY: ${{ secrets.OCID_API_KEY }}
        run: ./gradlew assembleCdrRelease
          -Pandroid.injected.signing.store.file=$(pwd)/my.keystore
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          -PnsApiKey=$NS_API_KEY
          -PocidApiKey=$OCID_API_KEY

      - name: Upload CDR APK
        uses: actions/upload-artifact@v6
        with:
          name: Network Survey CDR Release APK
          path: networksurvey/build/outputs/apk/cdr/release/*.apk

      - name: Save google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" > networksurvey/google-services.json

      - name: Build Regular Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          OCID_API_KEY: ${{ secrets.OCID_API_KEY }}
        run: ./gradlew assembleRegularRelease
          -Pandroid.injected.signing.store.file=$(pwd)/my.keystore
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          -PnsApiKey=$NS_API_KEY
          -PocidApiKey=$OCID_API_KEY

      - name: Upload Regular APK
        uses: actions/upload-artifact@v6
        with:
          name: Network Survey Regular Release APK
          path: networksurvey/build/outputs/apk/regular/release/*.apk

      - name: Build Regular Release Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          OCID_API_KEY: ${{ secrets.OCID_API_KEY }}
        run: ./gradlew bundleRegularRelease
          -Pandroid.injected.signing.store.file=$(pwd)/my.keystore
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          -PnsApiKey=$NS_API_KEY
          -PocidApiKey=$OCID_API_KEY

      - name: Upload Release Bundle
        uses: actions/upload-artifact@v6
        with:
          name: Network Survey Release Bundle
          path: networksurvey/build/outputs/bundle/regularRelease/*.aab

  uploadRelease:
    needs: buildRelease
    runs-on: ubuntu-latest

    steps:
      - name: Download Regular APK
        uses: actions/download-artifact@v6
        with:
          name: Network Survey Regular Release APK
          path: networksurvey/build/outputs/apk/regular/release/

      - name: Download CDR APK
        uses: actions/download-artifact@v6
        with:
          name: Network Survey CDR Release APK
          path: networksurvey/build/outputs/apk/cdr/release/

      - name: Download Release Bundle
        uses: actions/download-artifact@v6
        with:
          name: Network Survey Release Bundle
          path: networksurvey/build/outputs/bundle/regularRelease/

      - name: Create a Release in GitHub
        uses: ncipollo/release-action@v1
        with:
          artifacts: "networksurvey/build/outputs/apk/cdr/release/*.apk,networksurvey/build/outputs/apk/regular/release/*.apk"
          token: ${{ secrets.GH_TOKEN }}
          tag: ${{ steps.version.outputs.content }}
          commit: ${{ github.sha }}
          body: |
            ## What's Changed

            ---

            ### APK Downloads

            Each variant is built as per-architecture APKs for smaller download sizes. **Most users should download the `arm64-v8a` APK** (almost all modern Android phones). If unsure, use the `universal` APK which works on all devices but is larger.

            | Suffix | Architecture | Devices |
            |--------|-------------|---------|
            | `arm64-v8a` | 64-bit ARM | Most modern phones/tablets |
            | `armeabi-v7a` | 32-bit ARM | Older phones |
            | `x86_64` | 64-bit x86 | Some tablets, Chromebooks, emulators |
            | `x86` | 32-bit x86 | Older emulators |
            | `universal` | All | Works everywhere (larger file size) |

            The **regular-release** APK is the same as what can be found on the Google Play Store which contains the tracking library Google Analytics. The **cdr-release** APK is the same as the regular-release APK, but with full CDR support (See README.md for more details) and it also does NOT contain ANY tracking libraries such as Google Analytics.
          generateReleaseNotes: true
          draft: true

      - name: Release app to internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          packageName: com.craxiom.networksurvey
          releaseFiles: networksurvey/build/outputs/bundle/regularRelease/*.aab
          track: internal
          status: completed
