# Central Robolectric SDK pin for every unit test in this module.
#
# This matches compileSdk/targetSdk in networksurvey/build.gradle so tests exercise the same
# framework the app actually ships against. Robolectric 4.17 is the first release with an
# android-all jar for API 37, and API 36+ requires the build to run on JDK 21 or newer.
#
# Individual tests should NOT re-declare @Config(sdk = ...). Add an override here, or on the one
# test that genuinely needs a different level, and say why.
sdk=37
