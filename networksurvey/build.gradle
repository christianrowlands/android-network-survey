// Exclude google-services and crashlytics if the json file is missing and for debug builds
if (file("google-services.json").exists() && !gradle.startParameter.taskNames.any { it.contains("Debug") || it.contains("test") }) {
    logger.quiet("Using the google-services.json file")
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

import com.github.jk1.license.filter.LicenseBundleNormalizer
import com.github.jk1.license.render.SimpleHtmlReportRenderer
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

def appVersion = "1.55"
base {
    archivesName = "$applicationName-$appVersion"
}

// ABI-specific version codes: baseVersionCode * 1000 + abiCode (F-Droid splitabi convention)
// Each release slot spans 1000 codes (e.g. v-code 111 -> 111001..111004)
// Dual-ABI devices still prefer arm64 (002) over armv7 (001) via tie-break
// WARNING: abiCode must stay below 1000 to avoid range collisions
// Universal APK keeps the raw versionCode (lowest priority fallback)
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]

android {
    compileSdk = 37

    splits {
        abi {
            enable = true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            // Universal APK is only useful for F-Droid distribution. Skip it for
            // debug builds so Android Studio always deploys the matching per-ABI
            // APK (which carries the splitabi versionCode), avoiding install
            // downgrade conflicts when the device already has a per-ABI debug APK.
            universalApk = !gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("debug")
            }
        }
    }

    defaultConfig {
        buildConfigField "String", "MESSAGING_API_VERSION", "\"${libs.versions.networkSurveyMessaging.get()}\""
        buildConfigField 'String', "NS_API_KEY", "\"${nsApiKey}\""
        buildConfigField 'String', "OCID_API_KEY", "\"${ocidApiKey}\""
        applicationId "com.craxiom.networksurvey"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 114
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev" // Suffix for debug builds
            resValue "string", "app_name", "NS - dev"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true
        compose = true
        buildConfig = true
        resValues = true
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'google/cloud/audit/audit_log.proto']
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
    }

    lint {
        abortOnError = false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    namespace = 'com.craxiom.networksurvey'

    flavorDimensions = ["version"]
    productFlavors {
        // Regular is for Google Play that contains Firebase tracking features such as crashlytics
        regular {
            versionNameSuffix ""
        }

        // Has the extra CDR features and does not contain any tracking
        cdr {
            versionNameSuffix ""
        }
    }

}

android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
        if (baseAbiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 1000 + baseAbiVersionCode
        }
    }
}

configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-android-extensions-runtime'
